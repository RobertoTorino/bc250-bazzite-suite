# SPDX-License-Identifier: GPL-3.0-or-later
# The apps of this portal release: one tested combination. Each [apps.<name>] pins one release tag of that app.
#
# Rules (CI, tools/check_manifest.py):
#  * a change to this file needs a portal/VERSION bump at least as large as the largest app bump it pins
#    (an app patch release -> at least a portal patch release, an app minor -> at least a portal minor, ...);
#  * every tag must exist when the portal is released; on main a tag may be one that is about to be released
#    (its version equals that app's VERSION).
#
# Fields:
#   name, summary   shown on the pill
#   short           optional: the name on the tile (default: name without its "BC-250 " or "BC250 " prefix)
#   tag             the pinned release: <name>-v<x.y.z>; asset <tag>.tar.gz with SHA256SUMS on the suite release
#   sha256          of <tag>.tar.gz; filled in when the tag is released (empty: checked against SHA256SUMS only)
#   required        installed with the portal and always listed first (only bazzite-test)
#   changes_board   true: the portal warns before installing or opening it
#   development     true: listed under "Development only", apart from the apps for using the board
#   install         shell commands run in a terminal from the extracted release folder, in order
#   uninstall       idem, for removal
#   detect          paths whose existence means "installed" (any of them)
#   launch          [[label, command]] to open the app; none for apps that are not programs
#
# [checkout.<name>]: an app that runs from the suite checkout and is never released (apps/<name>/.checkout-only).
# Listed under "Development only"; only a portal that runs from a checkout, or was installed from one, can install
# it (its install and uninstall run in apps/<name> of that checkout). Without a checkout its tile is greyed. The same fields as above, without tag, sha256 and
# required, plus an optional folder (default apps/<name>) for one that lives elsewhere in the checkout.

[apps.bazzite-test]
name = "BC-250 Bazzite Test"
summary = "Read-only diagnostics, stress test and benchmarks. Always installed."
tag = "bazzite-test-v0.1.5"
sha256 = "d68e3bd5b0099a62713ed4ea231777894653c12324e7314038ae0db04a456d3c"
required = true
changes_board = false
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/bc250-bazzite-test"]
launch = [["Open", "~/.local/bin/bc250-bazzite-test"]]

