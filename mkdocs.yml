# SPDX-License-Identifier: GPL-3.0-or-later

site_name: BC250 Bazzite Suite
site_description: Tools for the AMD BC-250 running Bazzite
site_url: https://robertotorino.github.io/bc250-bazzite-suite/
repo_url: https://github.com/RobertoTorino/bc250-bazzite-suite
repo_name: RobertoTorino/bc250-bazzite-suite
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
plugins:
  - search
  - privacy                    # fonts and other external assets downloaded at build time and served from the
                               # wiki itself, so a visit sends nothing to Google Fonts
hooks:
  - tools/mkdocs/hooks.py
theme:
  name: material
  custom_dir: tools/mkdocs/overrides
  logo: images/wiki-icon.webp
  favicon: images/wiki-icon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:                     # dark only, without a switch
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/suite.css
extra:
  generator: false             # no "Made with Material for MkDocs" in the footer
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}   # GitHub's anchors
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Install: install.md
  - Portal: portal.md
  - Apps:
      - apps/index.md
      - BC-250 Bazzite Test: apps/bazzite-test.md
      - BC-250 GPU Governor Manager: apps/governor.md
      - HelixSR Manager: apps/helixsr.md
      - BC-250 CU Bisect: apps/cu-bisect.md
      - BC-250 Cores Bisect: apps/cores-bisect.md
      - BC-250 GPU OC Bisect: apps/gpu-oc-bisect.md
      - BC-250 Persistent ACPI: apps/persistent-acpi.md
      - System Overlay: apps/system-overlay.md
      - BC-250 BIOS Reader: apps/bios-reader.md
      - BC-250 Memory Manager: apps/memory-manager.md
      - BC-250 Fan Control: apps/fan-control.md
      - BC-250 USB Wi-Fi: apps/usb-wifi.md
      - BC-250 ACE Queues: apps/ace-queues.md
      - BC-250 Mesh Shaders: apps/mesh-shaders.md
      - HDMI CEC Manager: apps/hdmi-cec.md
      - Bazzite SFTP Tools: apps/sftp-tools.md
      - Dependency Checker: apps/dependency-checker.md
      - Bazzite NetcatGUI: apps/bazzite-netcatgui.md
      - Console Link: apps/console-link.md
      - shadPS4 Manager: apps/shadps4-manager.md
      - RPCS3 Manager: apps/rpcs3-manager.md
      - PPSSPP Manager: apps/ppsspp-manager.md
      - PCSX2 Manager: apps/pcsx2-manager.md
      - Vita3K Manager: apps/vita3k-manager.md
      - Decky Loader Manager: apps/decky-manager.md
      - Bazzite DatStation: apps/bazzite-datstation.md
  - Development:
      - development/index.md
      - Architecture and consistency: development/architecture.md
      - GitHub settings: development/github-settings.md
      - Bazzite Test script: development/bazzite-test.md
      - Bazzite Test internals: development/bazzite-test-internals.md
      - Bazzite Test test plan: development/bazzite-test-plan.md
      - Memory Manager internals: development/memory-manager.md
      - "Console Link: the stream's threads": development/console-link-stream.md
  - Security:
      - Security policy: SECURITY.md
      - Privacy: privacy.md
  - History:
      - What is Bazzite: history/bazzite.md
      - What is BC-250: history/bc250.md
  - Other tools:
      - Simple demo tool: other-tools/simple-demo-tool.md
validation:
  links:
    anchors: warn
