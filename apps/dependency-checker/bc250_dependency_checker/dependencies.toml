[[tool]]
name = "flashrom"
description = "Reads and writes flash chips. BIOS Reader uses it only to read the BIOS chip on the board, through the chipset's internal programmer; a flashrom built without that programmer cannot read it."
executables = ["flashrom"]
locations = ["~/flashrom/usr/bin/flashrom", "/usr/sbin/flashrom", "/usr/bin/flashrom"]
probe = "flashrom-internal"
root = true

[[tool.source]]
owner = "bios-reader"
need = "optional"
usage = "Read the BIOS flash chip; needs the internal programmer."
anchor = "reading-the-bios-flash-chip-optional"

[[tool]]
name = "pkexec"
description = "Runs one command as root after asking for your password in a desktop dialog (polkit). The apps use it for the few steps that need root, so the apps themselves run as your own user."
executables = ["pkexec"]

[[tool.source]]
owner = "bios-reader"
need = "optional"
usage = "Runs the flashrom read with a password prompt."
anchor = "reading-the-bios-flash-chip-optional"

[[tool.source]]
owner = "memory-manager"
need = "required"
usage = "Password prompt for reading and writing CMOS."

[[tool.source]]
owner = "governor"
need = "required"
usage = "Password prompt for privileged configuration, service actions and safe-point tests."

[[tool.source]]
owner = "ace-queues"
need = "required"
usage = "Password prompt for installing and removing the patched driver."

[[tool]]
name = "umr"
description = "AMD's user-mode register debugger: reads and writes the GPU's registers directly. The suite uses it to see which compute units are switched on and, in CU Bisect, to switch them."
executables = ["umr"]
root = true

[[tool.source]]
owner = "bazzite-test"
need = "optional"
usage = "Read live GPU registers for the active compute-unit count."

[[tool.source]]
