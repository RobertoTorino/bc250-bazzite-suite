name: Release

# One GitHub release per tag. Tags are made by hand, one per app: <app>-v<x.y.z> (bazzite-test-v0.1.0,
# governor-v0.4.0, ...) or portal-v<x.y.z>. The tag's version must equal that app's VERSION file.
#
# The assets are <tag>.tar.gz, SHA256SUMS and the notes, all built by tools/build_release.py, so a local build
# has the same content (see docs/portal.md, "Checking a release"). A portal release bundles the bazzite-test release that portal/apps.toml pins (downloaded
# from its own release and checked against the pin) and requires every pinned tag to exist.
#
# Console Link ships the wheel of its native core in the tarball (native/wheel, build_release.py checks it is
# there): built here from the tag, with FFmpeg from its pinned sources (native/ffmpeg/build.sh), so installing
# needs only pip.
#
# An app that ships a Windows executable (tools/build_windows_exe.py, WINDOWS_APPS) gets a second job on its tag:
# it builds the .exe on Windows and adds <app-id>-<version>-windows.zip and its .sha256 to the release the first job
# made. They are separate downloads; the portal and SHA256SUMS only know the tarball.
#
# After an app release: python3 tools/pin_app.py <tag>, bump portal/VERSION as tools/check_manifest.py asks, and
# tag the portal when the combination is tested.

on:
  push:
    tags: ["*-v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # tags, for check_manifest and the reproducible mtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checks
        run: |
          python tools/check_versions.py
          case "$TAG" in
            portal-v*) python tools/check_manifest.py --require-tags ;;
            *)         python tools/check_manifest.py ;;
          esac

      - name: Bundled Bazzite Test (portal releases)
        if: startsWith(github.ref_name, 'portal-v')
        run: |
          bt=$(python -c 'import tomllib; print(tomllib.load(open("portal/apps.toml", "rb"))["apps"]["bazzite-test"]["tag"])')
          mkdir -p bundle
          gh release download "$bt" --pattern "$bt.tar.gz" --pattern SHA256SUMS --dir bundle

      - name: Native wheel (console-link releases)
        if: startsWith(github.ref_name, 'console-link-v')
        working-directory: apps/console-link/native
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nasm libva-dev
          ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg"
          python -m pip install -q "maturin>=1.5,<2"
          BC250_FFMPEG_DIR="$RUNNER_TEMP/ffmpeg" maturin build --release --locked --compatibility linux \
            --features python,pyo3/extension-module,decoder -o wheel

      - name: Build
        run: |
          args=()
          [ -d bundle ] && args+=(--bundle bundle)
          python tools/build_release.py "$TAG" dist "${args[@]}"
          cat dist/SHA256SUMS

      - name: Publish
        run: |
          app=${TAG%-v*}
          title="$app ${TAG##*-v}"
          # Only a portal release is GitHub's "Latest": /releases/latest is what users install, never an app.
          latest=false
          [ "$app" = portal ] && latest=true
          gh release create "$TAG" "dist/$TAG.tar.gz" dist/SHA256SUMS \
            --title "$title" --notes-file dist/notes.md --verify-tag --latest="$latest"

  windows:
    # sftp-tools; add the tag of every app in WINDOWS_APPS (tools/tests/test_build_windows_exe.py checks it is here)
    if: startsWith(github.ref_name, 'sftp-tools-v')
    needs: release
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -q -r apps/sftp-tools/requirements.txt pyinstaller pillow

      - name: Build the executable
        run: python tools/build_windows_exe.py sftp-tools windist

      - name: Add it to the release
        shell: bash
        run: gh release upload "$TAG" windist/*.zip windist/*.zip.sha256 --clobber
