# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Suite-wide checks. The old per-app workflows were removed; per-app releases move here at migration step 3.

on:
  push:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hard-coded versions match each VERSION file
        run: python tools/check_versions.py

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [core, apps/governor, apps/helixsr]    # every folder with a tests/ folder
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"

      - name: Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install
        run: python -m pip install -q -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          rc=0
          while IFS= read -r -d '' f; do bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }; done \
            < <(find apps lib -name '*.sh' -print0)
          exit $rc

      # shellcheck is preinstalled on ubuntu-latest. Error level for everything; warning level for the scripts
      # that their own release workflows already held to it.
      - name: shellcheck (errors, all scripts)
        run: find apps lib -name '*.sh' -print0 | xargs -0 shellcheck -S error

      - name: shellcheck (warnings, cores-bisect and gpu-oc-bisect)
        run: |
          shellcheck -S warning apps/cores-bisect/bc250-cores-bisect.sh apps/cores-bisect/bc250-cores-unlock.sh \
            apps/cores-bisect/install.sh apps/cores-bisect/packaging/bazzite/*.sh
          shellcheck -S warning apps/gpu-oc-bisect/bc250-gpu-oc-bisect.sh apps/gpu-oc-bisect/install.sh

      - name: Line endings
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)' ; then echo "::error::CRLF in the index (see above)"; exit 1; fi

      # Commits made from Windows record new files as 100644 (core.fileMode=false); tools/fix-modes.sh repairs it.
      - name: Scripts are executable
        run: |
          missing=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "$missing" ]; then
            echo "::error::not executable in git (run tools/fix-modes.sh):"; echo "$missing"; exit 1
          fi

      - name: Every former repo has its LICENSE and .gitignore
        run: |
          rc=0
          for d in core portal apps/*; do
            for f in LICENSE .gitignore VERSION; do
              [ -f "$d/$f" ] || { echo "::error::$d/$f missing"; rc=1; }
            done
          done
          exit $rc

      - name: Workflows only at the repo root
        run: |
          if find . -path ./.git -prune -o -path ./.github -prune -o -type d -name .github -print | grep . ; then
            echo "::error::GitHub only runs workflows from the root .github/; move these"; exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2"
      - run: mkdocs build --strict
