# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Suite-wide checks on every push and pull request. Releases are made by release.yml, one per tag.

on:
  push:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # the base commit and the tags, for check_manifest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hard-coded versions match each VERSION file
        run: python tools/check_versions.py
      # apps.toml: every app listed, pinned tags exist (or are the next release), and a change to it comes with a
      # big enough portal/VERSION bump (see portal/README.md).
      - name: Portal manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_manifest.py ${BASE:+--base "$BASE"}

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [core, portal, tools, apps/bazzite-test, apps/governor, apps/helixsr, apps/persistent-acpi,
              apps/cu-bisect, apps/cores-bisect, apps/gpu-oc-bisect,
              apps/demo-tool, apps/dependency-checker, apps/suite-releases,
              apps/system-overlay, apps/bios-reader, apps/ace-queues, apps/memory-manager, apps/hdmi-cec, apps/sftp-tools,
              apps/console-link,
              tools/installer-tests/gui]   # every folder with tests/
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # the tags: tools/tests checks the shipped apps.toml, whose pins must exist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"

      - name: Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0

      - name: Install
        run: python -m pip install -q -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests        # -v: a crash log names the test

  # BC250 Console Link's native core (Rust, apps/console-link/native): its own tests, clippy, and the Python module
  # built into a wheel and tested from Python, all with the video decoder (FFmpeg from native/ffmpeg/build.sh, kept
  # in the cache until the script changes); clippy also without it, as a clone without FFmpeg builds it. Rust is
  # preinstalled on ubuntu-latest. The pytest job above skips tests/test_native.py, which needs the built module.
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console-link/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: nasm and the libva headers
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm libva-dev

      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/bc250-console-link
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('apps/console-link/native/ffmpeg/build.sh') }}

      - name: FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: ffmpeg/build.sh

      - name: cargo test
        run: cargo test --locked --features decoder

      - name: clippy
        run: |
          cargo clippy --locked --all-targets --features python,decoder -- -D warnings
          cargo clippy --locked --all-targets --features python -- -D warnings

      - name: Build the Python module
        run: |
          python -m pip install -q "maturin>=1.5,<2"
          maturin build --release --locked --compatibility linux --features python,pyo3/extension-module,decoder -o dist

      - name: Test the module from Python
        working-directory: apps/console-link         # the app's package imports from here, as in test.sh
        run: |
          python -m pip install -q -r requirements-dev.txt native/dist/*.whl     # conftest.py uses PyQt6
          python -m pytest -v tests/test_native.py tests/test_stream.py tests/test_senkusha.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          rc=0
          while IFS= read -r -d '' f; do bash -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }; done \
            < <(find apps portal tools test.sh install.sh -name '*.sh' -print0)
          exit $rc

      # shellcheck is preinstalled on ubuntu-latest. Error level for everything; warning level for the scripts
      # that their own release workflows already held to it.
      - name: shellcheck (errors, all scripts)
        run: find apps portal tools test.sh install.sh -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
      - name: shellcheck (warnings, cores-bisect, gpu-oc-bisect, persistent-acpi, system-overlay, bios-reader, ace-queues, memory-manager, hdmi-cec, sftp-tools, console-link and the suite's own scripts)
        run: |
          shellcheck -x -S warning portal/install.sh apps/bazzite-test/install.sh tools/*.sh tools/installer-tests/*.sh test.sh install.sh
          shellcheck -S warning apps/cores-bisect/bc250-cores-bisect.sh apps/cores-bisect/bc250-cores-unlock.sh \
            apps/cores-bisect/install.sh apps/cores-bisect/packaging/bazzite/*.sh
          shellcheck -S warning apps/gpu-oc-bisect/bc250-gpu-oc-bisect.sh apps/gpu-oc-bisect/install.sh
          shellcheck -S warning apps/persistent-acpi/bc250-acpi-override.sh apps/persistent-acpi/install.sh
          shellcheck -S warning apps/system-overlay/install.sh apps/bios-reader/install.sh apps/memory-manager/install.sh
          shellcheck -S warning apps/hdmi-cec/install.sh apps/sftp-tools/install.sh apps/console-link/install.sh
          shellcheck -S warning apps/ace-queues/bc250-ace-queues.sh apps/ace-queues/bc250-ace-queues-run \
            apps/ace-queues/install.sh apps/ace-queues/mesa/build-in-container.sh
          shellcheck -S warning apps/demo-tool/install.sh
          shellcheck -S warning apps/dependency-checker/install.sh
          shellcheck -S warning apps/suite-releases/*.sh

      - name: Line endings
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)' ; then echo "::error::CRLF in the index (see above)"; exit 1; fi

      # Commits made from Windows record new files as 100644 (core.fileMode=false); tools/fix-modes.sh repairs it.
      - name: Scripts are executable
        run: |
          missing=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "$missing" ]; then
            echo "::error::not executable in git (run tools/fix-modes.sh):"; echo "$missing"; exit 1
          fi

      - name: Every former repo has its LICENSE, .gitignore, VERSION and CHANGELOG
        run: |
          rc=0
          for d in core portal apps/* tools/installer-tests/gui; do
            for f in LICENSE .gitignore VERSION CHANGELOG; do
              [ -f "$d/$f" ] || { echo "::error::$d/$f missing"; rc=1; }
            done
          done
          for f in LICENSE .gitignore CHANGELOG README.md; do
            [ -f "$f" ] || { echo "::error::$f missing at the repo root"; rc=1; }
          done
          exit $rc

      - name: Workflows only at the repo root
        run: |
          if find . -path ./.git -prune -o -path ./.github -prune -o -type d -name .github -print | grep . ; then
            echo "::error::GitHub only runs workflows from the root .github/; move these"; exit 1
          fi

  # The installers on Linux without root or network: sudo becomes fakeroot, venvs are stubs (see shims.sh).
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fakeroot
        run: sudo apt-get install -y -q fakeroot
      - name: bazzite-test installer
        run: bash tools/installer-tests/bazzite-test.sh
      - name: governor installer
        run: bash tools/installer-tests/governor.sh
      - name: helixsr installer
        run: bash tools/installer-tests/helixsr.sh
      - name: cu-bisect installers
        run: bash tools/installer-tests/cu-bisect.sh
      - name: cores-bisect installer
        run: bash tools/installer-tests/cores-bisect.sh
      - name: gpu-oc-bisect installer
        run: bash tools/installer-tests/gpu-oc-bisect.sh
      - name: portal installer
        run: bash tools/installer-tests/portal.sh
      - name: persistent-acpi installer
        run: bash tools/installer-tests/persistent-acpi.sh
      - name: system-overlay installer
        run: bash tools/installer-tests/system-overlay.sh
      - name: bios-reader installer
        run: bash tools/installer-tests/bios-reader.sh
      - name: ace-queues installer
        run: bash tools/installer-tests/ace-queues.sh
      - name: memory-manager installer
        run: bash tools/installer-tests/memory-manager.sh
      - name: hdmi-cec installer
        run: bash tools/installer-tests/hdmi-cec.sh
      - name: sftp-tools installer
        run: bash tools/installer-tests/sftp-tools.sh
      - name: console-link installer
        run: bash tools/installer-tests/console-link.sh
      - name: Demo Tool installer
        run: bash tools/installer-tests/demo-tool.sh
      - name: Dependency checker installer
        run: bash tools/installer-tests/dependency-checker.sh
      - name: Suite Releases installer
        run: bash tools/installer-tests/suite-releases.sh
      - name: Installer Tests installer
        run: bash tools/installer-tests/installer-tests.sh
      - name: release tarballs, end to end
        run: bash tools/installer-tests/release.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2"
      - run: mkdocs build --strict

  windows-exe:
    # The Windows executables of the release workflow, built here too so a broken build shows before a tag.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r apps/sftp-tools/requirements.txt pyinstaller pillow
      - run: python tools/build_windows_exe.py sftp-tools windist
