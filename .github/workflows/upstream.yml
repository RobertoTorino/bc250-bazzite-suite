# SPDX-License-Identifier: GPL-3.0-or-later
name: Upstream

# Weekly: are the apps that pin an upstream release still in step with it (tools/check_upstream.py)? A failed job
# means that upstream moved: for Decky Loader a newer release, a replaced asset or a changed service unit, for shadPS4
# a newer release (the summary gives its zip and SHA-256) or a replaced zip, for HelixSR a release newer than the one
# the HelixSR Manager was checked against, or another fallback in its notes. It only reads from GitHub; nothing is
# changed or published.

on:
  schedule:
    - cron: "0 6 * * 1"         # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decky-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decky Loader against the pin in apps/decky
        run: python3 tools/check_upstream.py decky
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shadps4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shadPS4 against the pin in apps/shadps4
        run: python3 tools/check_upstream.py shadps4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helixsr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HelixSR against what apps/helixsr knows
        run: python3 tools/check_upstream.py helixsr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
